name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build (portable exe + NSIS installer)
        run: npx tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/emdy.exe "out/EmDy-$v-portable.exe"
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe "out/EmDy-$v-setup.exe"
          Get-ChildItem out

      # Artefact non signé : requis par SignPath (le fichier doit provenir d'un build GitHub).
      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: EmDy-windows-unsigned
          path: out/*

      # Signature gratuite SignPath Foundation (projets open source).
      # Active seulement si la variable de dépôt SIGNPATH_ORGANIZATION_ID est définie
      # (voir CODE_SIGNING_POLICY.md). Sinon, la release est publiée sans signature.
      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'EmDy' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Choose files to publish
        id: files
        shell: pwsh
        run: |
          $dir = if (Test-Path signed) { "signed" } else { "out" }
          "dir=$dir" >> $env:GITHUB_OUTPUT
          Get-ChildItem $dir | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            "$($_.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: EmDy-windows
          path: ${{ steps.files.outputs.dir }}/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "EmDy $tag" --generate-notes }
          gh release upload $tag (Get-ChildItem "${{ steps.files.outputs.dir }}/*").FullName --clobber
